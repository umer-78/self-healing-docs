name: Self-healing docs
description: Fail a pull request whose API changes leave documentation stale, and say which sections and how to fix them
inputs:
  package:
    description: The package directory whose public API the docs describe
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - shell: bash
      run: pip install "${{ github.action_path }}"
    - shell: bash
      run: python -m heal check --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --package "${{ inputs.package }}"
