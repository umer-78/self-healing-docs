[project]
name = "self-healing-docs"
version = "0.1.0"
description = "Catch the doc sections an API change leaves stale, and patch the renames"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["heal"]
